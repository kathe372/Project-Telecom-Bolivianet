server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA routing ───────────────────────────────────────────────────────────
    # index.html nunca se cachea: tras cada deploy el navegador debe pedir la
    # versión nueva (los assets con hash sí se cachean 1 año más abajo).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Resolver DNS — Railway usa [fd12::10]; en Docker local es 127.0.0.11
    resolver ${NGINX_RESOLVER} valid=10s;

    # ── Proxy REST al backend .NET ────────────────────────────────────────────
    location ^~ /api/ {
        set $backend ${BACKEND_INTERNAL_URL};
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Proxy SignalR WebSocket al backend .NET ───────────────────────────────
    location ^~ /hubs/ {
        set $backend ${BACKEND_INTERNAL_URL};
        proxy_pass             $backend;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP  $remote_addr;
        proxy_cache_bypass     $http_upgrade;
        proxy_read_timeout     86400s;
    }

    # ── Archivos estáticos subidos por el backend ─────────────────────────────
    location ^~ /uploads/ {
        set $backend ${BACKEND_INTERNAL_URL};
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Proxy multimedia del chatbot ──────────────────────────────────────────
    location ^~ /chatbot-uploads/ {
        set $chatbot ${CHATBOT_INTERNAL_URL};
        proxy_pass         $chatbot;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=86400";
    }

    # ── Archivos estáticos con caché larga ────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Cabeceras de seguridad ────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    server_tokens off;
}
