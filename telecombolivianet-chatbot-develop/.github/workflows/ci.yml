name: CI — Chatbot NestJS

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-build-test:
    name: Lint, Build & Test (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint -- --max-warnings=0

      - name: Build (NestJS)
        run: npm run build

      - name: Ejecutar tests con cobertura
        run: npm run test:cov

      - name: Publicar resultados de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-chatbot
          path: coverage/
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-build-test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Docker Build
        run: docker build -t telecombolivianet-chatbot:ci .
