name: CI — Backend .NET

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore dependencias
        run: dotnet restore src/TelecomBoliviaNet.Presentation/TelecomBoliviaNet.Presentation.csproj

      - name: Build (Release)
        run: dotnet build src/TelecomBoliviaNet.Presentation/TelecomBoliviaNet.Presentation.csproj --no-restore --configuration Release

      - name: Ejecutar tests
        run: |
          dotnet test tests/TelecomBoliviaNet.Tests/TelecomBoliviaNet.Tests.csproj \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage"

      - name: Publicar resultados de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-backend
          path: "**/TestResults/**"
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Docker Build
        run: docker build -t telecombolivianet-backend:ci .
