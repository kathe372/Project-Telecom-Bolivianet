name: CI — Backend .NET

# Los workflows solo se ejecutan si viven en .github/workflows/ de la RAÍZ del
# repositorio. Al unificar los cuatro servicios en un monorepo, los tres ci.yml
# que había dentro de cada carpeta de servicio quedaron inertes: GitHub Actions
# no los leía y no se ejecutaba ninguna comprobación en ningún push.
#
# Este workflow los sustituye para el backend. El filtro de rutas evita
# reconstruir .NET cuando el cambio solo toca el chatbot o el frontend.

on:
  push:
    branches: ["**"]
    paths:
      - "telecombolivianet-backend-develop/**"
      - "Project-Telecom-Bolivianet.sln"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "telecombolivianet-backend-develop/**"
      - "Project-Telecom-Bolivianet.sln"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

env:
  SOLUTION: Project-Telecom-Bolivianet.sln
  TESTS_DIR: telecombolivianet-backend-develop/tests

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      # La solución completa, no solo Presentation. Antes se restauraba y
      # compilaba únicamente el proyecto de arranque y luego se ejecutaba
      # `dotnet test --no-build` sobre un proyecto de test que nadie había
      # compilado en ese paso.
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      # Los tres proyectos, no uno. Antes solo corría TelecomBoliviaNet.Tests:
      # los 54 tests unitarios y los 91 de integración no se ejecutaban nunca en CI.
      - name: Tests unitarios (dominio puro)
        run: >
          dotnet test ${{ env.TESTS_DIR }}/TelecomBoliviaNet.UnitTests
          --no-build --configuration Release
          --logger "trx;LogFileName=unit.trx"

      - name: Tests de servicios y handlers
        run: >
          dotnet test ${{ env.TESTS_DIR }}/TelecomBoliviaNet.Tests
          --no-build --configuration Release
          --logger "trx;LogFileName=services.trx"
          --collect:"XPlat Code Coverage"

      # Testcontainers levanta postgis/postgis:16-3.4-alpine. El runner de
      # ubuntu-latest ya trae Docker, así que no hace falta ningún servicio extra.
      - name: Tests de integración (Testcontainers + PostGIS)
        run: >
          dotnet test ${{ env.TESTS_DIR }}/TelecomBoliviaNet.IntegrationTests
          --no-build --configuration Release
          --logger "trx;LogFileName=integration.trx"

      # ── Puertas de calidad (F9) ──────────────────────────────────────────
      # Un umbral en el CI es lo que impide que la mejora se deshaga sola en tres
      # meses. Los números son los MEDIDOS hoy, no objetivos: existen para que no
      # se pueda empeorar sin que alguien lo decida a propósito.

      - name: Paridad de esquema (las migraciones se escriben a mano — ADR-004)
        run: >
          dotnet test ${{ env.TESTS_DIR }}/TelecomBoliviaNet.IntegrationTests
          --no-build --configuration Release
          --filter "FullyQualifiedName~SchemaParity"

      - name: El contrato del chatbot no se rompe en silencio (F8.1)
        run: >
          dotnet test ${{ env.TESTS_DIR }}/TelecomBoliviaNet.IntegrationTests
          --no-build --configuration Release
          --filter "FullyQualifiedName~BotEndpoints"

      - name: Ninguna acción hereda su política de autorización (D-25)
        run: python3 scripts/politicas-explicitas.py

      - name: Application no vuelve a depender más de EF Core
        run: |
          cd telecombolivianet-backend-develop
          N=$(grep -rl "using Microsoft.EntityFrameworkCore"               src/TelecomBoliviaNet.Application --include=*.cs | wc -l)
          echo "Archivos de Application con EF Core: $N (techo: 40)"
          # Cuidado con esta cifra: cuenta ARCHIVOS, así que partir una clase
          # grande en tres la empeora sin añadir una sola dependencia nueva. Pasó
          # en F5: 34 -> 38 sin tocar una línea de acceso a datos. De ahí que el
          # techo sea 40. Lo que de verdad importa es cuántos casos de uso
          # componen su propia consulta, no en cuántos ficheros están repartidos.
          if [ "$N" -gt 40 ]; then
            echo "::error::Regresión de inversión de dependencias: $N > 40"
            exit 1
          fi

      - name: Ninguna clase de Application pasa de 250 líneas
        run: |
          cd telecombolivianet-backend-develop
          # Dos siguen por encima, argumentadas en el plan (F5). El techo está en
          # 2 para que no aparezca una tercera sin que nadie se entere.
          GRANDES=$(find src/TelecomBoliviaNet.Application -name "*.cs" -not -path "*/obj/*"                     | xargs wc -l | awk '$1 > 250 && $2 != "total"')
          N=$(echo "$GRANDES" | grep -c . || true)
          echo "Clases de Application > 250 líneas: $N (techo: 2)"
          if [ "$N" -gt 2 ]; then
            echo "$GRANDES" | sort -rn
            echo "::error::Hay $N clases por encima de 250 líneas"
            exit 1
          fi

      - name: Las funciones largas no crecen (trinquete)
        run: python3 scripts/funciones-largas.py

      - name: Publicar resultados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-backend
          path: "**/TestResults/**"
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Docker Build
        run: docker build -t telecombolivianet-backend:ci telecombolivianet-backend-develop
