networks:
  # backend-net: capa de aplicación (frontend ↔ backend ↔ chatbot)
  backend-net:
    driver: bridge
  # data-net: capa de datos — sin acceso a internet, solo servicios internos
  data-net:
    driver: bridge
    internal: true

volumes:
  postgres_backend:
  postgres_chatbot:
  redis_data:
  uploads_data:

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: bolivianet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       telecombolivianet
      POSTGRES_USER:     telecom_user
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD no definido — define en .env}"
    volumes:
      - postgres_backend:/var/lib/postgresql/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telecom_user -d telecombolivianet"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-chatbot:
    image: pgvector/pgvector:pg16
    container_name: bolivianet-postgres-chatbot
    restart: unless-stopped
    environment:
      POSTGRES_DB:       chatbot_db
      POSTGRES_USER:     chatbot_user
      POSTGRES_PASSWORD: "${CHATBOT_DB_PASSWORD:?CHATBOT_DB_PASSWORD no definido — define en .env}"
    volumes:
      - postgres_chatbot:/var/lib/postgresql/data
      - ./telecombolivianet-chatbot-develop/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bolivianet-redis
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD no definido}"
    volumes:
      - redis_data:/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./telecombolivianet-backend-develop
      dockerfile: Dockerfile
    container_name: bolivianet-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=telecombolivianet;Username=telecom_user;Password=${DB_PASSWORD:?DB_PASSWORD no definido}"
      Jwt__Key: "${JWT_KEY:?JWT_KEY no definido — generar con openssl rand -base64 48}"
      Jwt__Issuer: TelecomBoliviaNet
      Jwt__Audience: TelecomBoliviaNet_Client
      Jwt__ExpirationHours: "8"
      Jwt__RefreshTokenExpirationDays: "30"
      SecretEncryption__Key: "${SECRET_ENCRYPTION_KEY:?SECRET_ENCRYPTION_KEY no definido — generar con openssl rand -base64 32}"
      WhatsApp__Token: "${WHATSAPP_TOKEN:-}"
      WhatsApp__PhoneNumberId: "${WHATSAPP_PHONE_NUMBER_ID:-}"
      WhatsApp__ApiVersion: v19.0
      Cors__AllowedOrigins__0: "${FRONTEND_URL:-http://localhost}"
      Chatbot__BaseUrl: "http://chatbot:3001"
      Chatbot__InternalToken: "${SISTEMA_BOT_STATIC_TOKEN:?SISTEMA_BOT_STATIC_TOKEN no definido — generar con openssl rand -hex 32}"
      SISTEMA_BOT_EMAIL: "${SISTEMA_BOT_EMAIL:-bot@telecombolivianet.bo}"
      SISTEMA_BOT_PASSWORD: "${SISTEMA_BOT_PASSWORD:?SISTEMA_BOT_PASSWORD no definido}"
      ADMIN_SEED_PASSWORD: "${ADMIN_SEED_PASSWORD:-}"
      ADMIN_RESET_PASSWORD: "${ADMIN_RESET_PASSWORD:-}"
      Swagger__Enabled: "${SWAGGER_ENABLED:-false}"
      # Email — Provider: Smtp (Gmail, cualquier destinatario) o Resend (sandbox)
      Email__Provider: "${EMAIL_PROVIDER:-Smtp}"
      Email__ApiKey: "${RESEND_API_KEY:-}"
      Email__FromAddress: "${EMAIL_FROM_ADDRESS:-}"
      Email__FromName: "${EMAIL_FROM_NAME:-TelecomBoliviaNet}"
      Email__Smtp__User: "${SMTP_USER:-}"
      Email__Smtp__Password: "${SMTP_PASSWORD:-}"
      App__FrontendUrl: "${FRONTEND_URL:-http://localhost}"
      SlaAlert__HorasAnticipacion: "4"
      SlaAlert__HoraInicioLaboral: "7"
      SlaAlert__HoraFinLaboral: "22"
      AutoClose__WaitDays: "3"
      # Supabase Storage (backend) — activar cuando Supabase__Url esté configurado
      Supabase__Url:    "${SUPABASE_URL:-}"
      Supabase__Key:    "${SUPABASE_ANON_KEY:-}"
      Supabase__Bucket: "${SUPABASE_BACKEND_BUCKET:-telecombolivianet-uploads}"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net
      - data-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  chatbot:
    build:
      context: ./telecombolivianet-chatbot-develop
      dockerfile: Dockerfile
      target: production
    container_name: bolivianet-chatbot
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      TZ:          America/La_Paz
      NODE_ENV:    production
      PORT:        3001

      DB_HOST:     postgres-chatbot
      DB_PORT:     5432
      DB_USERNAME: chatbot_user
      DB_PASSWORD: "${CHATBOT_DB_PASSWORD:?CHATBOT_DB_PASSWORD no definido}"
      DB_DATABASE: chatbot_db
      DB_SYNCHRONIZE: "false"
      DB_LOGGING:  "false"

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB:   0
      REDIS_SESSION_TTL: 86400
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD no definido — generar con openssl rand -base64 24}"

      CORS_ORIGINS: "${FRONTEND_URL:-http://localhost}"

      SISTEMA_API_URL:  http://backend:5000
      SISTEMA_BOT_EMAIL:    ${SISTEMA_BOT_EMAIL:-bot@telecombolivianet.bo}
      SISTEMA_BOT_PASSWORD: "${SISTEMA_BOT_PASSWORD:?SISTEMA_BOT_PASSWORD no definido}"
      SISTEMA_JWT_REFRESH_MARGIN_MINUTES: 60

      SISTEMA_BOT_STATIC_TOKEN: "${SISTEMA_BOT_STATIC_TOKEN:?SISTEMA_BOT_STATIC_TOKEN no definido}"

      META_APP_SECRET:                ${META_APP_SECRET:-}
      META_VERIFY_TOKEN:              "${META_VERIFY_TOKEN:?META_VERIFY_TOKEN no definido}"
      META_ACCESS_TOKEN:              ${WHATSAPP_TOKEN:-}
      META_PHONE_NUMBER_ID:           ${WHATSAPP_PHONE_NUMBER_ID:-}
      META_WHATSAPP_BUSINESS_ACCOUNT_ID: ${META_WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      # v21+: requerido por typing_indicator (MEJORA-1B); backend/notifier ya usan v19
      META_API_VERSION:               v21.0
      META_API_URL:                   https://graph.facebook.com

      GEMINI_API_KEY:        ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL:     ${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      # Opt-C: modelo liviano para tareas triviales (sentimiento, resúmenes).
      # M2: se reemplazan GEMINI_INTENT_MODEL/GEMINI_RAG_MODEL (config fantasma
      # que el código nunca leía) por esta, que sí se usa.
      GEMINI_LIGHT_MODEL:    ${GEMINI_LIGHT_MODEL:-gemini-2.0-flash-lite}
      GEMINI_EMBED_MODEL:    text-embedding-004
      GEMINI_MAX_TOKENS:     768
      GEMINI_TEMPERATURE:    "0.3"
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GEMINI_LOCATION: ${GEMINI_LOCATION:-us-central1}

      # BUG-R3: 0.50 recuperaba chunks apenas relacionados (alucinación). 0.65
      # resultó DEMASIADO alto (verificado E2E: excluía el chunk legítimo de
      # "costo de instalación", similitud real ~0.63). 0.55 rechaza lo irrelevante
      # sin excluir FAQs borderline; el agente aporta la 2ª capa anti-alucinación.
      RAG_SIMILARITY_THRESHOLD: "0.55"
      RAG_CONTEXT_MESSAGES:     5
      RAG_MAX_CHUNKS:           3

      BOT_INSTALLATION_DAYS_AHEAD: 7
      BOT_NUDGE_AFTER_MS: "${BOT_NUDGE_AFTER_MS:-8000}"

      RATE_LIMIT_WINDOW_SECONDS: 60
      RATE_LIMIT_MAX_REQUESTS:   20

      PSEUDONYM_TTL_SECONDS: 300
      PII_GUARD_MODE:        permissive

      # 'local' (default) | 'supabase'
      STORAGE_TYPE:       "${STORAGE_TYPE:-local}"
      STORAGE_LOCAL_PATH: ./uploads
      STORAGE_PUBLIC_URL: "${CHATBOT_PUBLIC_URL:-}"

      CHATBOT_PUBLIC_URL: "${CHATBOT_PUBLIC_URL:-}"

      WHATSAPP_MOCK: "${WHATSAPP_MOCK:-false}"

      # Supabase Storage (chatbot) — activar cuando STORAGE_TYPE=supabase
      SUPABASE_URL:             "${SUPABASE_URL:-}"
      SUPABASE_ANON_KEY:        "${SUPABASE_ANON_KEY:-}"
      SUPABASE_STORAGE_BUCKET:  "${SUPABASE_CHATBOT_BUCKET:-chatbot-uploads}"

    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres-chatbot:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - backend-net
      - data-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  notifier:
    build:
      context: ./telecombolivianet-notifier-develop
      dockerfile: Dockerfile
    container_name: bolivianet-notifier
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      DATABASE_URL:             "postgresql://telecom_user:${DB_PASSWORD:?DB_PASSWORD no definido}@postgres:5432/telecombolivianet"
      WHATSAPP_TOKEN:           ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION:     v19.0
      POLL_INTERVAL_SECONDS:    ${POLL_INTERVAL_SECONDS:-30}
      BATCH_SIZE:               50
      MAX_ATTEMPTS:             4
      BACKOFF_SECONDS:          60,300,1800,7200
      TIMEZONE:                 ${TIMEZONE:-America/La_Paz}
      LOG_LEVEL:                ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - backend-net
      - data-net

  frontend:
    build:
      context: ./telecombolivianet-frontend-develop
      dockerfile: Dockerfile
    container_name: bolivianet-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      BACKEND_INTERNAL_URL: http://backend:5000
      CHATBOT_INTERNAL_URL: http://chatbot:3001
      NGINX_RESOLVER: 127.0.0.11
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backend-net
